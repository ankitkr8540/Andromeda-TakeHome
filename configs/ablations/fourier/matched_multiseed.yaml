# Matching Adam budgets across initialization strategies; bounds are a disclosed prior.
model_type: fourier
seed: 42
max_epochs: 30000
reference: spectral_adam_k8
targets: [rich_periodic]
model:
  num_frequencies: 8
variants:
  random_adam_k8:
    training: {fourier_initialization: random, fourier_fit: adam}
  spectral_adam_k8:
    training: {fourier_initialization: spectral, fourier_fit: adam}
