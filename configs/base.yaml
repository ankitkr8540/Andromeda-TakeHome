preprocessing:
  scaling: standard
training:
  batch_size: 64
  learning_rate: 1e-3
  max_epochs: 20000
  patience: 150
  min_delta: 1e-6
  device: cpu
evaluation:
  generate_plots: true
  save_predictions: true
tracking:
  enabled: true
  tracking_uri: http://127.0.0.1:5001
  log_model: true
  log_preprocessor: true
  log_figures: true
