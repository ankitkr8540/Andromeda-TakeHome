
# Experiment identity
experiment:
  name: mlp_baseline
  run_name: mlp_random_standard_seed42
  seed: 42
  output_dir: outputs/mlp_random_standard_seed42

# Synthetic dataset generation
data:
  n_train: 840
  n_val: 140
  n_test: 420
  x_min: -31.41592653589793
  x_max: 31.41592653589793
  sampling: uniform
  split_strategy: random

# Preprocessing
preprocessing:
  scaling: standard

# Model architecture
model:
  type: mlp
  input_dim: 1
  hidden_dim: 64
  num_hidden_layers: 2
  output_dim: 1

# Training
training:
  batch_size: 64
  learning_rate: 0.001
  max_epochs: 2000
  patience: 150
  min_delta: 0.000001
  device: cpu

# Evaluation
evaluation:
  metrics:
    - mse
    - rmse
    - mae
    - r2
  generate_plots: true
  save_predictions: true

# Experiment tracking
tracking:
  enabled: true
  tracking_uri: http://127.0.0.1:5001
  log_model: true
  log_preprocessor: true
  log_figures: true
