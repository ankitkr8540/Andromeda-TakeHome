experiment:
  name: damped_fourier_regression
  run_name: damped_fourier_chronological_seed42
  seed: 42
  output_dir: outputs/damped_fourier_chronological_seed42
data:
  n_train: 1000
  n_val: 200
  n_test: 200
  x_min: -31.41592653589793
  x_max: 31.41592653589793
  sampling: uniform
  split_strategy: chronological
  target: damped_oscillation
preprocessing:
  scaling: none
model:
  type: damped_fourier
  num_frequencies: 8
  frequency_min: 0.1
  frequency_max: 5.0
  initial_decay: 0.02
training:
  batch_size: 64
  learning_rate: 1e-3
  max_epochs: 30000
  patience: 300
  min_delta: 1e-12
  device: cpu
  fourier_initialization: spectral
evaluation:
  metrics: [mse, rmse, mae, r2]
  generate_plots: true
  save_predictions: true
tracking:
  enabled: true
  tracking_uri: http://127.0.0.1:5001
  log_model: true
  log_preprocessor: true
  log_figures: true
